services:
  send2ereader:
    image: ghcr.io/devnullv0id/send2ereader:latest
    container_name: send2ereader
    restart: unless-stopped
    ports:
      - 3001:3001
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false
    environment:

      TZ: UTC
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
