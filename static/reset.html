<!doctype html>
<html lang="en">
<head>
	<title>Sign in · Send to eReader</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E"/>
	<link rel="stylesheet" href="/fonts/fonts.css"/>
	<link rel="stylesheet" href="/fonts/phosphor.css"/>
	<link rel="stylesheet" href="/app.css"/>
	<link rel="stylesheet" href="/screens.css"/>
	<script src="/auth.js" defer></script>
	<script src="/shell.js" defer></script>
	<script src="/history.js" defer></script>
	<script src="/signin.js" defer></script>
</head>
<body data-page="reset">
<div class="shell">
	<header class="header"></header>

	<main class="main">
		<div class="wrap">
			<div class="auth">
				<h1 class="auth__title">Sign in</h1>
				<p class="auth__sub">Only to remember your devices, defaults and history. Sending works without it, and always will.</p>

				<div class="auth-whose">Setting a new password for <span class="mono" id="resetEmail"></span></div>

				<form id="resetform">
					<div class="auth__label">New password</div>
					<div class="auth__field-wrap">
						<input class="auth__field" type="password" id="password" name="password" placeholder="At least eight characters" autocomplete="new-password" required data-password-note/>
						<button type="button" class="auth__reveal" data-reveal tabindex="-1" aria-pressed="false" aria-label="Show the passwords"><i class="ph ph-eye" aria-hidden="true"></i></button>
					</div>
					<div class="pw-rules" data-pw-rules="password" aria-hidden="true"></div>
					<div class="auth__field-wrap">
						<input class="auth__field" type="password" id="confirm" placeholder="Repeat new password" autocomplete="new-password" required/>
						<span class="auth__status" aria-hidden="true"><i class="ph" aria-hidden="true"></i></span>
					</div>

					<button type="button" class="option auth__remember" data-remember hidden role="checkbox" aria-checked="true">
						<span class="checkbox is-on">✓</span>
						<span class="option__text">
							<span class="option__label">Stay signed in on this device</span>
							<span class="option__desc">Otherwise you're signed out when the browser window closes.</span>
						</span>
					</button>

					<button type="submit" class="auth__submit" id="submitbtn" disabled>Set password and sign in</button>
					<p class="auth__error" id="note" hidden></p>
				</form>

				<p class="auth__note auth__note--wide">Every other session is signed out when this saves.</p>
			</div>
		</div>
	</main>

	<footer class="footer"></footer>
</div>
</body>
</html>
