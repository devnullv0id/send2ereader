<!doctype html>
<html lang="en">
<head>
	<title>Send to eReader</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E"/>
	<link rel="stylesheet" type="text/css" href="./style.css"/>
	<script src="./common.js"></script>
</head>
<body>

<div class="wrapper">
	<h1>Send to eReader</h1>
	<p class="tagline">Enter this key on your phone or computer</p>

	<div class="panel">
		<span class="panel-title">Your key</span>
		<span id="keyoutput" class="waiting">&ndash;&ndash;&ndash;&ndash;</span>
		<button id="keygen" class="btn" type="button">New key</button>
	</div>

	<div id="downloads" class="panel">
		<span class="panel-title">Ready to download</span>
		<a id="downloadlink" class="downloadlink"><span class="label">Tap to save</span><span id="downloadname"></span></a>
	</div>

	<div id="urls" class="panel">
		<span class="panel-title">Links</span>
		<div id="urllist"></div>
	</div>

	<hr/>
	<div class="footer">
		Open this address on another device to send books here:<br/>
		<a id="siteurl">/</a><br/><br/>
		Maintained by <a href="https://github.com/devnullv0id" target="_blank">devnullv0id</a>.
		Inspired by <a href="https://github.com/daniel-j/send2ereader" target="_blank">djazz</a>.<br/>
		<a href="https://github.com/devnullv0id/send2ereader" target="_blank">Source on GitHub</a>
	</div>
</div>

<div id="logs"></div>

<script src="./receive.js"></script>
</body>
</html>
