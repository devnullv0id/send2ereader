<!doctype html>
<html lang="en">
<head>
	<title>Send to eReader</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E"/>
	<link rel="stylesheet" type="text/css" href="./style.css?v=4"/>
	<script src="./common.js?v=4"></script>
</head>
<body>

<div class="wrapper">
	<h1>Send to eReader</h1>
	<p class="tagline">Enter this key on your phone or computer</p>

	<div class="panel">
		<span class="panel-title">Your key</span>
		<span id="keyoutput" class="waiting">&ndash;&ndash;&ndash;&ndash;</span>
		<button id="keygen" class="btn" type="button">New key</button>
	</div>

	<div id="downloads" class="panel">
		<span class="panel-title">Ready to download</span>
		<a id="downloadlink" class="downloadlink"><span class="label">Tap to save</span><span id="downloadname"></span></a>
	</div>

	<div id="urls" class="panel">
		<span class="panel-title">Links</span>
		<div id="urllist"></div>
	</div>

	<hr/>
	<div class="footer">
		Open this address on another device to send books here:<br/>
		<a id="siteurl">/</a><br/><br/>
		Maintained by <a href="https://github.com/devnullv0id" target="_blank">devnullv0id</a>.
		Inspired by <a href="https://github.com/daniel-j/send2ereader" target="_blank">djazz</a>.<br/>
		<a href="https://github.com/devnullv0id/send2ereader" target="_blank">Source on GitHub</a>
	</div>
</div>

<div id="logs"></div>

<script type="text/javascript">

var keyOutput = document.getElementById('keyoutput')
var keyGenBtn = document.getElementById('keygen')
var downloads = document.getElementById('downloads')
var downloadlink = document.getElementById('downloadlink')
var downloadname = document.getElementById('downloadname')
var urlsnode = document.getElementById('urls')
var urllist = document.getElementById('urllist')
var siteurl = document.getElementById('siteurl')
var key = null
var pollTimer = null
var placeholder = '––––'
var renderedUrls = ''

function setPlaceholder(text) {
	keyOutput.textContent = text
	keyOutput.className = 'waiting'
}

function resetKey() {
	if (pollTimer) clearInterval(pollTimer)
	pollTimer = null
	key = null
	setPlaceholder(placeholder)
	downloads.style.display = 'none'
	downloadlink.href = ''
	downloadname.textContent = ''
	renderUrls([])
}

function renderUrls(urls) {
	var joined = urls.join('\n')
	if (joined === renderedUrls) return
	renderedUrls = joined

	while (urllist.firstChild) urllist.removeChild(urllist.firstChild)
	if (urls.length === 0) {
		urlsnode.style.display = 'none'
		return
	}
	urlsnode.style.display = 'block'

	for (var i = 0; i < urls.length; i++) {
		var link = document.createElement('a')
		link.href = urls[i]
		link.target = '_blank'
		link.textContent = urls[i]
		link.className = 'downloadlink'
		urllist.appendChild(link)
	}
}

function applyStatus(data) {
	if (data.file) {
		downloads.style.display = 'block'
		downloadname.textContent = data.file.name
		downloadlink.href = './download/' + encodeURIComponent(data.file.name) + '?key=' + key
	} else {
		downloads.style.display = 'none'
	}
	renderUrls(data.urls && data.urls.length > 0 ? data.urls : [])
}

function pollFile() {
	if (!key) return
	var asked = key
	xhr('GET', './status/' + asked, function (x) {
		if (asked !== key) return

		if (x.status === 404) {
			generateKey()
			return
		}
		if (x.status !== 200) return

		var data
		try {
			data = JSON.parse(x.responseText)
		} catch (err) {
			return
		}
		if (data.error) {
			generateKey()
			return
		}
		applyStatus(data)
	})
}

function startPolling() {
	if (pollTimer) clearInterval(pollTimer)
	pollTimer = setInterval(pollFile, 2 * 1000)
}

function rememberKey(value) {
	if (window.history && window.history.replaceState) {
		window.history.replaceState(null, '', '#' + value)
	} else {
		window.location.hash = value
	}
}

function showKey(value) {
	key = value
	keyOutput.textContent = value
	keyOutput.className = ''
	placeholder = new Array(value.length + 1).join('–')
	rememberKey(value)
	startPolling()
}

function generateKey() {
	resetKey()
	setPlaceholder('…')
	xhr('POST', './generate', function (x) {
		if (x.status === 200 && x.responseText && x.responseText !== 'error') {
			showKey(x.responseText)
		} else {
			setPlaceholder('error')
		}
		keyGenBtn.blur()
	})
}

function keyFromAddress() {
	var raw = window.location.hash.replace('#', '').toUpperCase()
	return /^[A-Z0-9]{1,16}$/.test(raw) ? raw : null
}

function resumeOrGenerate() {
	var previous = keyFromAddress()
	if (!previous) {
		generateKey()
		return
	}
	setPlaceholder('…')
	xhr('GET', './status/' + previous, function (x) {
		if (x.status !== 200) {
			generateKey()
			return
		}
		var data
		try {
			data = JSON.parse(x.responseText)
		} catch (err) {
			generateKey()
			return
		}
		if (data.error) {
			generateKey()
			return
		}
		showKey(previous)
		applyStatus(data)
	})
}

window.onload = function () {
	keyGenBtn.onclick = generateKey
	resumeOrGenerate()
}

siteurl.textContent = window.location.protocol + '//' + window.location.host + '/'
siteurl.href = window.location.protocol + '//' + window.location.host + '/'
siteurl.target = '_self'
</script>
</body>
</html>
