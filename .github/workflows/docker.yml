name: Docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this build'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Keyed on the commit rather than the ref, so pushing master and its version
# tag together does not build the same tree twice and leave the index each run
# published orphaned by the next.
concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Nothing gets published past a red suite. Every push to master used to tag,
  # push :latest and cut a release without running the tests once.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A local hook can be skipped with --no-verify, and the leak this exists
      # for was pushed a day after it was committed, when the working tree was
      # already clean. This looks at the whole history, from CI, where nobody
      # can wave it through. It needs no dependencies, so it runs before install
      # and fails in seconds.
      - name: Look for credentials in the history
        run: node scripts/scan-for-credentials.mjs --all

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  version:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      major_minor: ${{ steps.next.outputs.major_minor }}
      stable: ${{ steps.next.outputs.stable }}
      create_tag: ${{ steps.next.outputs.create_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: next
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -eu

          EXISTING=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1 || true)

          if [ -n "$EXISTING" ]; then
            TAG="$EXISTING"
            CREATE=false
            echo "Commit is already tagged ${TAG}, using it as-is"
          else
            BUMP="${INPUT_BUMP:-auto}"
            if [ "$BUMP" = 'auto' ]; then
              MSG=$(git log -1 --pretty=%B HEAD)
              case "$MSG" in
                *'[major]'*) BUMP=major ;;
                *'[minor]'*) BUMP=minor ;;
                *)           BUMP=patch ;;
              esac
            fi
            echo "Bump: ${BUMP}"

            LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)

            if [ -z "$LAST" ]; then
              TAG="v1.0.0"
              echo "No previous version tag, starting at ${TAG}"
            else
              V="${LAST#v}"
              MAJOR="${V%%.*}"
              REST="${V#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              case "$BUMP" in
                major) TAG="v$((MAJOR + 1)).0.0" ;;
                minor) TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
                *)     TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              esac
              echo "Previous version ${LAST}, next is ${TAG}"
            fi
            CREATE=true
          fi

          VERSION="${TAG#v}"

          case "$VERSION" in
            *-*) STABLE=false; MAJOR_MINOR="$VERSION" ;;
            *)   STABLE=true;  MAJOR_MINOR="${VERSION%.*}" ;;
          esac

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "stable=${STABLE}"
            echo "create_tag=${CREATE}"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=send2ereader
            org.opencontainers.image.description=Send ebooks to Kobo/Kindle ereaders easily
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      # One architecture at a time, each pushed under its own tag. Building both
      # at once makes buildx push an index whose per-architecture children have
      # no tags of their own: in the packages list they read as debris, and
      # deleting them empties every tag that points at them — which is how every
      # published tag of this image was broken once. Built this way, the children
      # are tagged and the index below is stitched from those tags.
      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            KFX_INPUT_PLUGIN_URL=${{ vars.KFX_INPUT_PLUGIN_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          # Both of these would add manifests of their own, and they arrive
          # untagged.
          provenance: false
          sbom: false

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            KFX_INPUT_PLUGIN_URL=${{ vars.KFX_INPUT_PLUGIN_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

      - name: Stitch the multi-arch index from those two tags
        run: |
          set -eu
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version.outputs.version }}"

          ARGS="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed '/^[[:space:]]*$/d; s/^/--tag /' | tr '\n' ' ')"

          # shellcheck disable=SC2086
          docker buildx imagetools create $ARGS \
            "${REPO}:${VERSION}-amd64" "${REPO}:${VERSION}-arm64"

      - name: Prove every published tag can actually be pulled
        run: |
          set -eu
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            docker buildx imagetools inspect "$TAG" >/dev/null
            echo "ok  ${TAG}"
          done

      # The unit suite stubs every converter off, which is how epub-to-pdf was
      # broken in every image ever built and stayed green. This runs the image
      # that was just pushed and converts a real book into every format it
      # offers, so a missing library is caught here rather than by a reader.
      - name: Convert a real book in the image that was just built
        run: |
          IMAGE="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -1)"
          echo "Smoke testing ${IMAGE}"
          docker run -d --name smoke -p 3001:3001 -e ACCOUNTS=false "${IMAGE}"

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/healthz

          node scripts/smoke-convert.mjs http://127.0.0.1:3001

      - name: What the container said, if it did not
        if: failure()
        run: docker logs smoke || true

      - name: Stop the smoke container
        if: always()
        run: docker rm -f smoke || true

  tag:
    needs: [version, build-and-push]
    if: needs.version.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Create the version tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on the remote, nothing to do"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "$TAG"

  release:
    needs: [version, build-and-push, tag]
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' && needs.tag.result != 'failure' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.stable != 'true' }}
