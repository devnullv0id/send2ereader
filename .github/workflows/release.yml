name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag the release is cut from, e.g. v1.0.1'
        required: true
        type: string
      version:
        description: 'Image tag, i.e. the git tag without the v, e.g. 1.0.1'
        required: true
        type: string
      prerelease:
        description: 'Keep this off the "Latest release" badge'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do"
            exit 0
          fi

          args=(--title "$TAG" --generate-notes)
          [ "$PRERELEASE" = 'true' ] && args+=(--prerelease)

          NOTES=$(printf '```sh\ndocker pull %s:%s\n```' "$IMAGE" "$VERSION")

          gh release create "$TAG" "${args[@]}" --notes "$NOTES"
