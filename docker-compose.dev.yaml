services:
  send2ereader:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        KFX_INPUT_PLUGIN_URL: ${KFX_INPUT_PLUGIN_URL:-}
    image: send2ereader:dev
    container_name: send2ereader-dev
    ports:
      - 3001:3001
    volumes:
      - ./static:/usr/src/app/static:ro
      - dev_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: debug
      EXPIRE_SECONDS: 30
      MAX_EXPIRE_SECONDS: 600
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dev_data:
